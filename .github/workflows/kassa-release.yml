# Сборка и выпуск NeoPos Kassa для Windows.
# Запуск: отправить тег вида v0.1.1 (git tag v0.1.1 && git push origin v0.1.1)
# или вручную на вкладке Actions. Куда публикуется установщик — см. "publish" в desktop/package.json.
name: Kassa for Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      # Главный терминал (работа без интернета): в приложение кладём экран кассы и сервер NeoPos.
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci

      - name: Build kassa and local server
        working-directory: .
        run: node desktop/scripts/build-local.mjs

      # Версия приложения берётся из тега: v0.2.0 → 0.2.0
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # Маленький веб-установщик (NeoPos-Setup.exe) + пакет приложения. Файлы загружаются
      # в черновик релиза — так параллельные загрузки не создают дубликаты релиза.
      - name: Build installer and upload to draft release
        run: npx electron-builder --win nsis-web --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Когда все файлы на месте — публикуем релиз и делаем его последним (на него ведёт ссылка «Скачать»).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
