# Render Blueprint: сервер NeoPos + база PostgreSQL.
# В Render: New → Blueprint → выбрать этот репозиторий → Apply.
services:
  - type: web
    name: neopos-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: neopos-db
          property: connectionString

databases:
  - name: neopos-db
    plan: free
    region: frankfurt
