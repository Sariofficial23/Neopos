<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>NeoPos Kassa</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        height: 100vh; display: grid; place-items: center; padding: 16px;
        font-family: 'Segoe UI', system-ui, sans-serif; color: #111a33;
        background:
          radial-gradient(60% 50% at 12% 10%, #ffc9e3 0%, transparent 70%),
          radial-gradient(55% 55% at 90% 15%, #a9d2ff 0%, transparent 70%),
          radial-gradient(60% 60% at 70% 95%, #c9b8ff 0%, transparent 70%), #dfe7fb;
      }
      .card {
        width: 100%; max-width: 380px; padding: 28px; text-align: center; display: grid; gap: 14px;
        background: rgba(255, 255, 255, 0.55); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 22px;
        box-shadow: 0 10px 36px rgba(40, 50, 120, 0.16); backdrop-filter: blur(26px);
      }
      h1 { font-size: 26px; font-weight: 800; }
      p { color: #5c6787; font-size: 15px; line-height: 1.45; }
      button { height: 52px; border: 0; border-radius: 14px; background: #0a84ff; color: #fff; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
      small { color: #5c6787; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1><img src="build/neopos.webp" alt="NeoPos" width="168" height="56" style="display:block;margin:auto;border-radius:10px"></h1>
      <p id="msg">Internet bilan aloqa yo‘q.<br />Нет связи с интернетом.</p>
      <button id="retry">Qayta urinish · Повторить</button>
      <button id="cloud" hidden style="background:#7d8a99">Internet orqali ishlash · Работать через интернет</button>
      <small id="note"></small>
    </div>
    <script>
      const params = new URLSearchParams(location.search)
      const target = params.get('url')
      const mode = params.get('mode')
      const go = () => { if (target && /^(https:\/\/|http:\/\/[0-9.]+:4455)/.test(target)) location.href = target }
      if (mode === 'starting') {
        document.getElementById('msg').innerHTML = 'Bosh terminal ishga tushmoqda…<br />Главный терминал запускается…'
        document.getElementById('retry').hidden = true
      } else if (mode === 'lan') {
        document.getElementById('msg').innerHTML = 'Bosh terminal bilan aloqa yo‘q.<br />Нет связи с главным терминалом. Проверьте, что он включён.'
        const cloud = document.getElementById('cloud')
        cloud.hidden = false
        cloud.onclick = () => window.neoposDesktop.netOff()
      }
      document.getElementById('retry').onclick = go
      let left = 15
      setInterval(() => {
        left -= 1
        document.getElementById('note').textContent = left > 0 ? left + ' s' : ''
        if (mode === 'starting') return (document.getElementById('note').textContent = '')
        if (left <= 0) { left = 15; go() }
      }, 1000)
    </script>
  </body>
</html>
