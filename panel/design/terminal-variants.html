<!doctype html>
<html lang="ru" data-theme="glass">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NeoPos — варианты дизайна терминала</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ───────── 1: Liquid Glass, светлый ───────── */
  :root[data-theme='glass'] {
    --page: #dfe7fb;
    --bg:
      radial-gradient(60% 50% at 12% 10%, #ffc9e3 0%, transparent 70%),
      radial-gradient(55% 55% at 90% 15%, #a9d2ff 0%, transparent 70%),
      radial-gradient(60% 60% at 70% 95%, #c9b8ff 0%, transparent 70%),
      radial-gradient(50% 50% at 15% 90%, #b5f0e3 0%, transparent 70%);
    --panel: rgba(255, 255, 255, 0.46);
    --panel-border: 1px solid rgba(255, 255, 255, 0.78);
    --panel-shadow: 0 10px 36px rgba(40, 50, 120, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    --blur: blur(26px) saturate(180%);
    --bar: rgba(255, 255, 255, 0.5);
    --text: #111a33; --muted: #5c6787; --line: rgba(17, 26, 51, 0.12);
    --send: #0a84ff; --send-text: #fff;
    --close: #22b866; --close-text: #fff;
    --tile-mix: 78%; --tile-border: 1px solid rgba(255, 255, 255, 0.7);
    --tile-shadow: 0 6px 18px rgba(40, 50, 120, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.55);
    --badge: rgba(17, 26, 51, 0.55);
    --r: 22px; --r-sm: 14px;
  }
  /* ───────── 2: Liquid Glass, тёмный ───────── */
  :root[data-theme='night'] {
    --page: #090d1c;
    --bg:
      radial-gradient(55% 55% at 10% 5%, #5b21b6 0%, transparent 70%),
      radial-gradient(50% 50% at 95% 20%, #0e7490 0%, transparent 70%),
      radial-gradient(55% 55% at 75% 100%, #9d174d 0%, transparent 70%),
      radial-gradient(45% 45% at 20% 95%, #1d4ed8 0%, transparent 70%);
    --panel: rgba(255, 255, 255, 0.07);
    --panel-border: 1px solid rgba(255, 255, 255, 0.16);
    --panel-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    --blur: blur(28px) saturate(160%);
    --bar: rgba(255, 255, 255, 0.08);
    --text: #f2f5ff; --muted: #a3acc9; --line: rgba(255, 255, 255, 0.14);
    --send: #38bdf8; --send-text: #05202e;
    --close: #34d399; --close-text: #052e1f;
    --tile-mix: 52%; --tile-border: 1px solid rgba(255, 255, 255, 0.22);
    --tile-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
    --badge: rgba(0, 0, 0, 0.45);
    --r: 22px; --r-sm: 14px;
  }
  /* ───────── 3: Тёплый ───────── */
  :root[data-theme='warm'] {
    --page: #f3ece1;
    --bg: linear-gradient(160deg, #f8f1e6 0%, #efe4d3 100%);
    --panel: #fffaf2;
    --panel-border: 1px solid #ebdfcc;
    --panel-shadow: 0 14px 34px rgba(120, 84, 40, 0.1);
    --blur: none;
    --bar: #2a2017;
    --text: #2a2017; --muted: #8a7964; --line: #e9dcc8;
    --send: #e8590c; --send-text: #fff;
    --close: #1f7a4d; --close-text: #fff;
    --tile-mix: 100%; --tile-border: 0;
    --tile-shadow: 0 4px 12px rgba(120, 84, 40, 0.16);
    --badge: rgba(42, 32, 23, 0.6);
    --r: 22px; --r-sm: 14px;
  }
  :root[data-theme='warm'] .bar { color: #fffaf2; }
  /* ───────── 4: Контраст ───────── */
  :root[data-theme='bold'] {
    --page: #f1f1ee;
    --bg: #f1f1ee;
    --panel: #fff;
    --panel-border: 2px solid #111;
    --panel-shadow: 4px 4px 0 #111;
    --blur: none;
    --bar: #111;
    --text: #111; --muted: #55554f; --line: #111;
    --send: #111; --send-text: #fff;
    --close: #c6f432; --close-text: #111;
    --tile-mix: 100%; --tile-border: 2px solid #111;
    --tile-shadow: 3px 3px 0 #111;
    --badge: #111;
    --r: 12px; --r-sm: 8px;
  }
  :root[data-theme='bold'] .bar { color: #fff; }
  :root[data-theme='bold'] .foot button { border: 2px solid #111; }

  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    color: var(--text);
    background: var(--bg) fixed, var(--page);
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .glass {
    background: var(--panel); border: var(--panel-border); box-shadow: var(--panel-shadow);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-radius: var(--r);
  }

  /* Переключатель вариантов — только для макета, в терминале его не будет */
  .picker { display: flex; gap: 4px; padding: 6px 8px; overflow-x: auto; scrollbar-width: none; flex: none; }
  .picker button { flex: none; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); }
  .picker button[aria-pressed='true'] { background: var(--text); color: var(--page); border-color: transparent; }

  /* Верхняя полоса */
  .bar {
    flex: none; display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 6px 0 14px;
    background: var(--bar); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--line);
  }
  .bar .logo { font-weight: 800; font-size: 17px; letter-spacing: -0.02em; margin-right: auto; }
  .bar .new { background: var(--close); color: var(--close-text); height: 38px; padding: 0 14px; border-radius: var(--r-sm); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .bar .lnk { height: 38px; padding: 0 12px; border-radius: var(--r-sm); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .bar .n { background: var(--close); color: var(--close-text); border-radius: 999px; min-width: 20px; height: 20px; font-size: 12px; display: inline-grid; place-items: center; padding: 0 5px; }

  /* Рабочая область: чек слева, меню справа — всегда рядом */
  .work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 11fr) minmax(0, 13fr); gap: 10px; padding: 10px; }

  .check { display: grid; grid-template-columns: 44px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; overflow: hidden; min-height: 0; }
  .rail { grid-row: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-right: 1px solid var(--line); color: var(--muted); }
  .rail button { width: 40px; height: 44px; border-radius: 10px; display: grid; place-items: center; }
  .rail button:hover { color: var(--text); }
  .rail .more { margin-top: auto; }

  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .head b { font-size: 17px; white-space: nowrap; }
  .head span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .lines { list-style: none; padding: 0 14px; overflow-y: auto; min-height: 0; }
  .lines li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .lines .q { height: 28px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
  .lines .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lines .s { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lines .new .q { background: var(--send); color: var(--send-text); border-color: transparent; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 28px 0; display: block !important; border: 0 !important; }

  .sum { padding: 10px 14px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .sum .tot { font-size: 24px; font-weight: 800; color: var(--text); margin-top: 2px; }
  .foot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 10px 10px; }
  .foot button { height: 56px; border-radius: var(--r-sm); font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
  .foot .send { background: var(--send); color: var(--send-text); }
  .foot .send i { font-style: normal; background: rgba(255, 255, 255, 0.25); border-radius: 999px; min-width: 24px; height: 24px; display: inline-grid; place-items: center; font-size: 13px; padding: 0 6px; }
  .foot .close { background: var(--close); color: var(--close-text); }

  /* Меню: путь + плитки */
  .menu { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .crumbs { flex: none; display: flex; align-items: center; gap: 6px; margin-bottom: 10px; min-width: 0; }
  .crumbs button, .crumbs span { height: 42px; padding: 0 12px; border-radius: var(--r-sm); display: inline-flex; align-items: center; font-weight: 600; font-size: 14px; border-radius: var(--r-sm); }
  .crumbs span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
  .crumbs .sp { margin-left: auto; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; overflow-y: auto; min-height: 0; padding: 2px 4px 6px 2px; align-content: start; }
  .tile {
    position: relative; height: 96px; padding: 8px; border-radius: var(--r-sm);
    background: color-mix(in srgb, var(--c) var(--tile-mix), transparent);
    border: var(--tile-border); box-shadow: var(--tile-shadow);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    color: #fff; font-weight: 700; font-size: 15px; line-height: 1.15; text-align: center;
    display: grid; place-items: center; overflow: hidden; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform 0.1s;
  }
  .tile:active { transform: scale(0.96); }
  .tile .p { position: absolute; top: 0; right: 0; background: var(--badge); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 0 0 0 10px; font-variant-numeric: tabular-nums; text-shadow: none; }
  .tile .star { position: absolute; bottom: 5px; left: 8px; font-size: 13px; opacity: 0.9; }
  .tile.stop { opacity: 0.4; }

  :focus-visible { outline: 3px solid var(--send); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Узкий экран: чек и меню остаются рядом, просто всё компактнее */
  @media (max-width: 720px) {
    .work { gap: 6px; padding: 6px; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
    .check { grid-template-columns: 34px minmax(0, 1fr); }
    .rail button { width: 32px; height: 38px; } .rail svg { width: 18px; height: 18px; }
    .head { padding: 8px; } .head b { font-size: 14px; } .head .t { display: none; }
    .lines { padding: 0 8px; } .lines li { grid-template-columns: 24px minmax(0, 1fr) auto; gap: 6px; font-size: 13px; padding: 8px 0; }
    .lines .q { height: 24px; font-size: 12px; }
    .sum { padding: 8px; } .sum .tot { font-size: 18px; }
    .foot { grid-template-columns: 1fr; gap: 6px; padding: 0 6px 6px; } .foot button { height: 46px; font-size: 13px; }
    .tiles { grid-template-columns: 1fr; gap: 6px; } .tile { height: 72px; font-size: 13px; }
    .crumbs button, .crumbs span { height: 36px; padding: 0 9px; font-size: 13px; } .crumbs .sp { display: none; }
    .bar { padding-left: 10px; } .bar .logo { font-size: 15px; } .bar .hide { display: none; }
    .bar .new { padding: 0 10px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="picker" role="group" aria-label="Вариант дизайна">
  <button data-t="glass" aria-pressed="true">1 · Liquid Glass</button>
  <button data-t="night" aria-pressed="false">2 · Ночное стекло</button>
  <button data-t="warm" aria-pressed="false">3 · Тёплый</button>
  <button data-t="bold" aria-pressed="false">4 · Контраст</button>
</div>

<header class="bar">
  <div class="logo">NeoPos</div>
  <button class="new">+ Новый заказ</button>
  <button class="lnk">Чеки <span class="n">2</span></button>
  <button class="lnk hide">Aziz</button>
</header>

<div class="work">
  <section class="check glass" aria-label="Чек">
    <nav class="rail" aria-label="Действия с чеком">
      <button title="Назад к столам"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button title="Клиент"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>
      <button title="Скидка"><svg viewBox="0 0 24 24"><path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg></button>
      <button title="Комментарий"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
      <button title="Разделить счёт"><svg viewBox="0 0 24 24"><path d="M12 21v-8M12 13 6 7V3M12 13l6-6V3"/></svg></button>
      <button class="more" title="Ещё"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </nav>
    <div class="head"><b>Стол 5</b><span><span class="t">00:18 · </span>№1284</span></div>
    <ul class="lines" id="lines"></ul>
    <div class="sum">
      <div><span id="sub">0</span></div>
      <div>обслуживание 10%: <span id="svc">0</span></div>
      <div class="tot" id="tot">0</div>
    </div>
    <div class="foot">
      <button class="send" id="send">Отправить <i id="cnt">0</i></button>
      <button class="close">Закрыть чек</button>
    </div>
  </section>

  <section class="menu" aria-label="Меню">
    <div class="crumbs" id="crumbs"></div>
    <div class="tiles" id="tiles"></div>
  </section>
</div>

<script>
  const CATS = [
    ['Горячее', '#e8590c'], ['Шашлык', '#c92a2a'], ['Салаты', '#2f9e44'],
    ['Выпечка', '#b7791f'], ['Напитки', '#1c7ed6'], ['Десерты', '#9c36b5'],
  ]
  const ITEMS = [
    ['Osh (to‘y oshi)', 38000, 0, true], ['Lag‘mon', 34000, 0], ['Manti, 5 dona', 32000, 0], ['Sho‘rva', 30000, 0],
    ['Qo‘y shashlik', 22000, 1, true], ['Tovuq shashlik', 18000, 1], ['Jigar shashlik', 17000, 1],
    ['Achchiq-chuchuk', 14000, 2], ['Sezar', 28000, 2],
    ['Somsa go‘shtli', 9000, 3], ['Non', 5000, 3],
    ['Ko‘k choy', 6000, 4, true], ['Kompot 1 l', 15000, 4], ['Coca-Cola 0.5', 10000, 4],
    ['Medovik', 19000, 5, false, true], ['Chak-chak', 16000, 5],
  ]
  const fmt = (n) => n.toLocaleString('ru-RU').replace(/,/g, ' ')
  const $ = (id) => document.getElementById(id)
  // Строки чека: отправленные на кухню и новые хранятся отдельно, как в настоящей кассе.
  const lines = [{ i: 0, q: 2, sent: true }, { i: 4, q: 4, sent: true }, { i: 11, q: 1, sent: false }]
  let cat = null

  function renderMenu() {
    const c = $('crumbs')
    c.innerHTML = ''
    const home = document.createElement('button')
    home.className = 'glass'
    home.title = 'Все категории'
    home.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5 10v10h14V10"/></svg>'
    home.onclick = () => { cat = null; renderMenu() }
    c.append(home)
    if (cat !== null) {
      const s = document.createElement('span')
      s.className = 'glass'
      s.textContent = CATS[cat][0]
      c.append(s)
    }
    const find = document.createElement('button')
    find.className = 'glass sp'
    find.title = 'Поиск'
    find.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>'
    c.append(find)

    const t = $('tiles')
    t.innerHTML = ''
    if (cat === null) {
      CATS.forEach(([name, color], idx) => {
        const b = document.createElement('button')
        b.className = 'tile'
        b.style.setProperty('--c', color)
        b.textContent = name
        b.onclick = () => { cat = idx; renderMenu() }
        t.append(b)
      })
      return
    }
    ITEMS.forEach(([name, price, c2, fav, stop], i) => {
      if (c2 !== cat) return
      const b = document.createElement('button')
      b.className = 'tile' + (stop ? ' stop' : '')
      b.disabled = !!stop
      b.style.setProperty('--c', CATS[cat][1])
      b.innerHTML = `<span class="p">${fmt(price)}</span>${name}${fav ? '<span class="star">★</span>' : ''}`
      b.onclick = () => {
        const cur = lines.find((l) => l.i === i && !l.sent)
        if (cur) cur.q++
        else lines.push({ i, q: 1, sent: false })
        renderCheck()
      }
      t.append(b)
    })
  }

  function renderCheck() {
    const ul = $('lines')
    ul.innerHTML = ''
    let sub = 0, fresh = 0
    for (const l of lines) {
      const [name, price] = ITEMS[l.i]
      sub += price * l.q
      if (!l.sent) fresh += l.q
      const li = document.createElement('li')
      if (!l.sent) li.className = 'new'
      li.innerHTML = `<span class="q">${l.q}</span><span class="nm">${name}</span><span class="s">${fmt(price * l.q)}</span>`
      ul.append(li)
    }
    if (!lines.length) ul.innerHTML = '<li class="empty">Чек пуст</li>'
    const svc = Math.round(sub * 0.1)
    $('sub').textContent = fmt(sub)
    $('svc').textContent = fmt(svc)
    $('tot').textContent = fmt(sub + svc) + ' so‘m'
    $('cnt').textContent = fresh
    ul.scrollTop = ul.scrollHeight
  }

  $('send').onclick = () => { lines.forEach((l) => (l.sent = true)); renderCheck() }

  function setTheme(t) {
    document.documentElement.dataset.theme = t
    document.querySelectorAll('.picker button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.t === t)))
  }
  document.querySelectorAll('.picker button').forEach((b) => (b.onclick = () => setTheme(b.dataset.t)))

  const q = new URLSearchParams(location.search)
  if (['glass', 'night', 'warm', 'bold'].includes(q.get('t'))) setTheme(q.get('t'))
  if (q.get('cat') !== null) cat = Math.min(CATS.length - 1, Math.max(0, Number(q.get('cat')) || 0))
  renderMenu(); renderCheck()
</script>
</body>
</html>
